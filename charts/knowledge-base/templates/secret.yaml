{{- if .Values.m2mSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-base.m2mSecretName" . }}
  labels:
    {{- include "knowledge-base.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.m2mSecret.key | quote }}: {{ required "m2mSecret.clientSecret is required when m2mSecret.create=true" .Values.m2mSecret.clientSecret | quote }}
{{- end }}
