apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-base.fullname" . }}
  labels:
    {{- include "knowledge-base.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "knowledge-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configuration: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.m2mSecret.create }}
        checksum/m2m-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "knowledge-base.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: knowledge-base
          image: {{ include "knowledge-base.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFIG_FILE
              value: /app/config/configuration.yaml
            - name: {{ include "knowledge-base.secretEnvName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge-base.m2mSecretName" . | quote }}
                  key: {{ required "m2mSecret.key is required" .Values.m2mSecret.key | quote }}
            {{- if .Values.webdavCa.enabled }}
            - name: FRED_SAMPLES_WEBDAV_CA_FILE
              value: {{ printf "%s/%s" (.Values.webdavCa.mountPath | trimSuffix "/") .Values.webdavCa.fileName | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: configuration
              mountPath: /app/config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.webdavCa.enabled }}
            - name: webdav-ca
              mountPath: {{ .Values.webdavCa.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "knowledge-base.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.webdavCa.enabled }}
        - name: webdav-ca
          configMap:
            name: {{ required "webdavCa.configMapName is required when webdavCa.enabled=true" .Values.webdavCa.configMapName | quote }}
            items:
              - key: {{ .Values.webdavCa.key | quote }}
                path: {{ .Values.webdavCa.fileName | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
