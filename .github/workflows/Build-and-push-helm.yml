# Validates the Helm chart on pull requests and publishes it as an OCI artifact
# when a repository chart/v* tag is pushed. Container images have their own
# code/v* release lifecycle in Build-and-push-docker.yml.

name: Build and Push Helm Chart

on:
  push:
    branches: ["swift"]
    tags: ["chart/v*"]
    paths:
      - "charts/**"
      - ".github/workflows/Build-and-push-helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/Build-and-push-helm.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/knowledge-base

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint --strict "${CHART_PATH}"

      - name: Render chart
        run: helm template knowledge-base "${CHART_PATH}" --namespace prism >/dev/null

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/chart/v')
        shell: bash
        run: |
          chart_version="$(helm show chart "${CHART_PATH}" | awk '/^version:/ { print $2 }')"
          release_version="${GITHUB_REF_NAME#chart/v}"
          if [[ "${chart_version}" != "${release_version}" ]]; then
            echo "Chart version ${chart_version} does not match tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Package chart
        run: helm package "${CHART_PATH}" --destination dist

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/chart/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        if: startsWith(github.ref, 'refs/tags/chart/v')
        run: helm push dist/knowledge-base-*.tgz "oci://${REGISTRY}/${{ github.repository }}/charts"
