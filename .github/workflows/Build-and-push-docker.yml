# Builds the Knowledge Base pod images and, on the default branch or a tag,
# pushes them to this repository's own GitHub container registry.
#
# Nothing is pushed that has not passed, in this order: the sample's offline
# test suite, a build, and `make docker-smoke` against the image just built.
# A pull request runs all three and pushes nothing, so a change that breaks the
# image is caught by the change that broke it rather than by whoever next cuts
# a tag.
#
# Both the tests and the image resolve fred-sdk from PyPI, so this runner needs
# nothing but a checkout of this repository — no sibling monorepo, no registry
# credentials beyond the token GitHub already gives the job.

name: Build and Push Docker Images

on:
  push:
    branches: ["swift"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per Knowledge Base pod that is published. The other two
        # samples build from the same Dockerfile — adding one is this block,
        # with its folder and its package name, and a `docker-smoke` target in
        # its Makefile.
        include:
          - kb: webdav
            package: fred_samples_webdav_kb
            image: fred-samples-webdav-kb

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        # UV_NO_SOURCES ignores [tool.uv.sources], which points at a sibling
        # monorepo checkout this runner does not have — for the sync and for
        # every `uv run` after it, which `make dev-pypi` alone would not cover.
        env:
          UV_NO_SOURCES: "1"
        run: make -C knowledge-bases/${{ matrix.kb }} test

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.knowledge-base
          # amd64 only, deliberately: this is what the target clusters run, and
          # an emulated arm64 build of a 1.4 GB image costs far more than it
          # buys. A developer on another architecture builds locally with
          # `make docker-build`.
          platforms: linux/amd64
          build-args: |
            KB=${{ matrix.kb }}
            KB_PACKAGE=${{ matrix.package }}
          load: true
          tags: ${{ matrix.image }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: make -C knowledge-bases/${{ matrix.kb }} docker-smoke DOCKER_IMAGE=${{ matrix.image }}:smoke

      - name: Log in to the registry
        # Skipped for a pull request, which has no write token and pushes
        # nothing.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        # The same build inputs as above, so every layer comes from the cache:
        # what is pushed is the image that was just smoke-tested.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.knowledge-base
          platforms: linux/amd64
          build-args: |
            KB=${{ matrix.kb }}
            KB_PACKAGE=${{ matrix.package }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
