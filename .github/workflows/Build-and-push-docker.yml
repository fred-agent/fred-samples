# Builds the Knowledge Base pod images and pushes them to this repository's own
# GitHub container registry, with the same triggers and tags as the Fred
# repository's own images:
#
#   git tag code/v1.2.3 && git push origin code/v1.2.3   ->  :v1.2.3, plus a GitHub release
#   a push to swift                                       ->  :swift-dev and :swift-dev-<short sha>
#
# Nothing is pushed that has not passed, in this order: the sample's offline
# test suite, a build, and `make docker-smoke` against the image just built.
# A pull request runs all three and pushes nothing, so a change that breaks the
# image is caught by the change that broke it rather than by whoever next cuts
# a tag.
#
# Both the tests and the image resolve fred-sdk from PyPI, so this runner needs
# nothing but a checkout of this repository — no sibling monorepo, no registry
# credentials beyond the token GitHub already gives the job.

name: Build and Push Docker Images

on:
  push:
    branches: ["swift"]
    tags: ["code/v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per Knowledge Base pod that is published. The other two
        # samples build from the same Dockerfile — adding one is this block,
        # with its folder and its package name, and a `docker-smoke` target in
        # its Makefile.
        include:
          - kb: webdav
            package: fred_samples_webdav_kb
            image: fred-samples-webdav-kb

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        # UV_NO_SOURCES ignores [tool.uv.sources], which points at a sibling
        # monorepo checkout this runner does not have — for the sync and for
        # every `uv run` after it, which `make dev-pypi` alone would not cover.
        env:
          UV_NO_SOURCES: "1"
        run: make -C knowledge-bases/${{ matrix.kb }} test

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.knowledge-base
          # amd64 only, deliberately: this is what the target clusters run, and
          # an emulated arm64 build of a 1.4 GB image costs far more than it
          # buys. A developer on another architecture builds locally with
          # `make docker-build`.
          platforms: linux/amd64
          build-args: |
            KB=${{ matrix.kb }}
            KB_PACKAGE=${{ matrix.package }}
          load: true
          tags: ${{ matrix.image }}:smoke
          # A pull request reads and writes the Actions cache to stay
          # affordable. The publish path stays uncached, as in the Fred
          # repository, so a pushed image never reuses layers built from an
          # unmerged branch.
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Smoke-test the image
        run: make -C knowledge-bases/${{ matrix.kb }} docker-smoke DOCKER_IMAGE=${{ matrix.image }}:smoke

      - name: Log in to the registry
        # Skipped for a pull request, which has no write token and pushes
        # nothing.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/(v.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev
            type=sha,enable=${{ github.ref == 'refs/heads/swift' }},prefix=swift-dev-,format=short

      - name: Push
        # The same build inputs as above, in the same builder, so every layer
        # comes from the step before: what is pushed is the image that was just
        # smoke-tested.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.knowledge-base
          platforms: linux/amd64
          build-args: |
            KB=${{ matrix.kb }}
            KB_PACKAGE=${{ matrix.package }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - name: Extract the version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dummy # only the version is wanted, not an image name
          tags: |
            type=match,pattern=code/(v.*),group=1

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            # images:
            ```
            oci://${{ env.REGISTRY }}/${{ github.repository }}/fred-samples-webdav-kb:${{ steps.meta.outputs.version }}
            ```
          draft: false
          prerelease: false
