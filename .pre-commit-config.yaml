repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        name: lint
        files: ^agents/
      - id: ruff-format
        name: format
        args: ["--diff"]
        files: ^agents/
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", "agents/.baseline/detect-secret-baseline.json"]
        name: leak
        exclude: ^agents/\.baseline/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.5
    hooks:
      - id: bandit
        args: ["-r", "-s", "B101,B108", "--", "agents/fred_samples_agents"]
        name: sast
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: v1.13.0
    hooks:
      - id: basedpyright
        name: type-check
        files: ^agents/
        args: ["--project", "agents"]
