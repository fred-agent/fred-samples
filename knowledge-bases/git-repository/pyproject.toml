[project]
name = "fred-samples-git-kb"
version = "0.1.0"
description = "Fred sample Knowledge Base — synchronize documents from a GitHub or GitLab repository"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  # The `knowledge-base` extra brings the workflow engine the `run` command
  # needs; `publish` and the handler itself do not load it. 4.1.0 is the first
  # release that ships `fred_pod`, which this sample imports for its M2M token.
  "fred-sdk[knowledge-base]>=4.1.0",
  # Git as a library: no binary in the image, no subprocess, and the token
  # passed as a parameter rather than embedded in a URL or a command line.
  "dulwich>=1.2.14",
  # gitignore's own pattern language, so include/exclude mean what they mean
  # in the repository being synchronized.
  "pathspec>=1.1.0",
]

# The contract's entry point is `python -m fred_samples_git_kb` (publish / run).
# This script is the offline developer tool beside it.
[project.scripts]
fred-samples-git-kb-dev = "fred_samples_git_kb.cli:main"

[project.optional-dependencies]
dev = [
  "bandit[baseline]>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_samples_git_kb*"]

[dependency-groups]
dev = [
  "bandit[baseline]>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]

[tool.uv.sources]
# Local path override for this monorepo's own fred-sdk, sibling to this repo
# under ~/Fred — the same convention as the local-folder sample beside it.
# Comment out to force PyPI resolution, or use `make dev-pypi`.
fred-sdk = { path = "../../../fred/libs/fred-sdk", editable = true }
