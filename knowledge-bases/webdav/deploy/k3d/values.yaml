# =============================================================================
# The WebDAV Knowledge Base on the local k3d instance: values for this
# repository's chart (charts/knowledge-base), deployed by fred-deployment-factory's
# `make k3d-app DIR=<this checkout>/knowledge-bases/webdav`.
#
# Only what k3d decides lives here. The chart's defaults already name Fred's
# services (control-plane-backend:8222, knowledge-flow-backend:8000), which is
# what k3d runs next to this pod.
#
#   address  where a service of the k3d stack (`make k3d-up`) is reached
#   secret   the client secret, by reference to fred-secrets; never a literal
#
# Image tags are not set here: deploy/k3d/build builds the image and writes its
# content tag into the image values the helmfile adds after this file.
# =============================================================================

configuration:
  security:
    m2m:
      realm_url: "http://keycloak:8080/realms/app"   # address: the issuer Fred trusts
  scheduler:
    temporal:
      host: "temporal:7233"                          # address

# secret: the kb-fred.samples client (deploy/k3d/identities.yaml) has its secret
# in fred-secrets, generated by the factory the first time.
m2mSecret:
  create: false
  existingSecret: fred-secrets
  key: KEYCLOAK_KB_FRED_SAMPLES_CLIENT_SECRET
