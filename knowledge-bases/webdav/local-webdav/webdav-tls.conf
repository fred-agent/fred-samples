# Optional local TLS listener; certificates are mounted at runtime.
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
Listen 443

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /run/webdav-tls/server.crt
    SSLCertificateKeyFile /run/webdav-tls/server.key
</VirtualHost>
