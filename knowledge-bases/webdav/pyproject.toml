[project]
name = "fred-samples-webdav-kb"
version = "0.1.0"
description = "Fred sample Knowledge Base — synchronize documents from a WebDAV share"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  # The `knowledge-base` extra brings the workflow engine the `run` command
  # needs; `publish` and the handler itself do not load it. 4.1.0 is the first
  # release whose base stays clear of the agents platform (fred-core, langchain).
  "fred-sdk[knowledge-base]>=4.1.0",
  # PROPFIND and GET. Used directly here, not only through the SDK's publisher.
  "httpx>=0.28.1",
  # A multistatus is XML written by somebody else's server. The standard
  # library parser is not built to be pointed at a third party's document, and
  # this one is a drop-in that is.
  "defusedxml>=0.7.1",
  # gitignore's own pattern language, so include/exclude mean what an operator
  # already expects them to mean.
  "pathspec>=1.1.0",
]

# The contract's entry point is `python -m fred_samples_webdav_kb` (publish /
# run). This script is the offline developer tool beside it.
[project.scripts]
fred-samples-webdav-kb-dev = "fred_samples_webdav_kb.cli:main"

[project.optional-dependencies]
dev = [
  "bandit[baseline]>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_samples_webdav_kb*"]

[dependency-groups]
dev = [
  "bandit[baseline]>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
# Local path override for this monorepo's own fred-sdk, sibling to this repo
# under ~/Fred — the same convention as the samples beside it. Comment out to
# force PyPI resolution, or use `make dev-pypi`.
# TEMPORARY E2E OVERRIDE — both lines point at the feature worktree; before commit,
# revert to the single line `fred-sdk = { path = "../../../fred/libs/fred-sdk", editable = true }`.
fred-sdk = { path = "../../../features/webdav/libs/fred-sdk", editable = true }
fred-pod = { path = "../../../features/webdav/libs/fred-pod", editable = true }
