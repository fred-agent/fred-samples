[project]
name = "fred-samples-agents"
version = "0.1.0"
description = "Fred sample agent pod — bank transfer and postal tracking with HITL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fred-sdk>=3.3.5",
  "fred-runtime>=3.3.7",
  "greenlet>=3.4.0",
  "uvicorn>=0.35",
  # Sample capability from apps/progress-tracker. Installing it IS the
  # registration, but it contributes no tools until PROGRESS_TRACKER_API_BASE
  # is set, so the pod is unchanged until you deploy that application.
  "fred-capability-progress-tracker",
  # Sample capability from apps/document-triage. Read-only: it holds no
  # credential and contributes tools only when the runtime injects the document
  # ports it reads.
  "fred-capability-document-triage",
]

[tool.uv.sources]
fred-capability-progress-tracker = { path = "../apps/progress-tracker/capability", editable = true }
fred-capability-document-triage = { path = "../apps/document-triage/capability", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_samples_agents*"]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.12.5",
]

