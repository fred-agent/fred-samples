# The sample's own workloads, in their own namespace.
#
# Two ordinary Deployments and Services. Fred reaches them only by the Service
# DNS names given in FRONTEND_APPLICATIONS_JSON, which is why an application
# can live in any namespace.
#
# The API is a first-party backend: it validates every caller's bearer itself
# and reads Fred's existing OpenFGA store directly, so it needs its own
# Keycloak M2M client and its own OpenFGA API token. Create
# `progress-tracker-security` out of band as described in README.md.
#
# One API serves both the iframe REST routes and the streamable HTTP MCP
# endpoint at /mcp. Agents authenticate to MCP with the current user's bearer;
# there is no shared service key and no Secret reaches the Fred agents namespace.
#
# TO ADAPT THIS TO YOUR CLUSTER, edit the values marked EDIT below.
---
apiVersion: v1
kind: Namespace
metadata:
  name: progress-tracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-tracker-ui
  namespace: progress-tracker
  labels: { app: progress-tracker-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: progress-tracker-ui }
  template:
    metadata:
      labels: { app: progress-tracker-ui }
    spec:
      containers:
        - name: ui
          image: progress-tracker-ui:sample
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: progress-tracker-ui
  namespace: progress-tracker
spec:
  selector: { app: progress-tracker-ui }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-tracker-api
  namespace: progress-tracker
  labels: { app: progress-tracker-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: progress-tracker-api }
  template:
    metadata:
      labels: { app: progress-tracker-api }
    spec:
      # The image runs as uid 10001; fsGroup is what makes the mounted volume
      # below writable by it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: progress-tracker-api:sample
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            # EDIT: read-only, used to show the conversations pinned to a task.
            # The caller's own bearer is forwarded, so this reads no one else's
            # chat. Point it at whichever agent pod serves your conversations --
            # for this repository's own pod that is
            # http://fred-samples-agents.<ns>.svc.cluster.local:8010/samples/agents/v1
            - name: RUNTIME_BASE
              value: http://fred-agents.fred.svc.cluster.local:80/fred/agents/v2
            # EDIT: exact `iss` of the incoming UI bearer. It must also be
            # reachable from this pod for JWKS discovery.
            - name: KEYCLOAK_REALM_URL
              value: https://fred.example.com/realms/fred
            # EDIT: the audience of Fred's login client, `app` by default. The
            # browser token must carry it in `aud`; see README.md.
            - name: KEYCLOAK_USER_AUDIENCE
              value: app
            # Must exactly match the MCP catalog id: the agent-facing routes
            # check this team capability in addition to application entitlement.
            - name: MCP_SERVER_ID
              value: mcp-progress-tracker
            # EDIT: this backend's own enabled confidential/M2M client.
            - name: KEYCLOAK_M2M_CLIENT_ID
              value: progress-tracker-service
            - name: PROGRESS_TRACKER_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: progress-tracker-security
                  key: m2m-client-secret
            # EDIT: fully qualified address of Fred's existing OpenFGA. The
            # Control Plane remains owner of the store and authorization model.
            - name: OPENFGA_API_URL
              value: http://openfga.fred.svc.cluster.local:9080
            - name: OPENFGA_STORE_NAME
              value: fred
            # Optional: uncomment when the deployment pins an existing model.
            # - name: OPENFGA_AUTHORIZATION_MODEL_ID
            #   value: "<existing-model-id>"
            - name: PROGRESS_TRACKER_OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: progress-tracker-security
                  key: openfga-api-token
            - name: PROGRESS_TRACKER_DB
              value: /data/progress-tracker.db
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
      volumes:
        # emptyDir keeps the sample to one `kubectl apply` with no storage
        # class to pick: the task records live as long as the pod does. Swap in
        # a PersistentVolumeClaim the moment you want them to outlive a restart.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: progress-tracker-api
  namespace: progress-tracker
spec:
  selector: { app: progress-tracker-api }
  ports: [{ port: 8000, targetPort: 8000 }]
