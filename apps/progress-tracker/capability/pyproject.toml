[project]
name = "fred-capability-progress-tracker"
version = "0.1.0"
description = "Sample capability: advance tasks owned by the progress-tracker application."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Same floor as the sample agent pod, so installing this into it cannot
    # drag the SDK backwards.
    "fred-sdk>=3.3.5",
    "httpx",
    "langchain-core",
]

# Installing this package IS the registration: the agents pod discovers the
# capability at boot through this entry point.
[project.entry-points."fred.capabilities"]
progress_tracker = "fred_capability_progress_tracker.capability:ProgressTrackerCapability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fred_capability_progress_tracker"]

[tool.uv.sources]
# Local path override for development against the monorepo's own fred-core /
# fred-sdk / fred-runtime, sibling to this repo under ~/Fred. Keeps `uv run` /
# `uv sync` from silently reverting to the PyPI versions. Comment out to force
# PyPI resolution.
fred-sdk = { path = "../../../../fred/libs/fred-sdk", editable = true }
