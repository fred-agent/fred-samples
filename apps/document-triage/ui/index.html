<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Document Triage</title>
    <script>
      // Fred keys its palette off [data-theme] on <html>. The host sends the
      // user's choice in its context, but not before this page paints, so the OS
      // preference stands in until it arrives and remains the answer for a host
      // too old to send one. Inline and blocking on purpose: a deferred script
      // would paint the light palette first and flash.
      window.fredTheme = (() => {
        const os = matchMedia("(prefers-color-scheme: dark)");
        let fromHost = null;
        const apply = () =>
          document.documentElement.setAttribute(
            "data-theme", fromHost ?? (os.matches ? "dark" : "light"));
        os.addEventListener("change", apply);
        apply();
        return (theme) => { fromHost = theme ?? null; apply(); };
      })();
    </script>
    <!-- The iframe src has no trailing slash, so a relative URL would resolve
         one directory too high. This pins every relative URL below, the module
         import included, to the prefix nginx serves this page at. -->
    <base href="/apps/document-triage/" />
    <link rel="stylesheet" href="fred-tokens.css" />
    <style>
      /* Colours and radii come from @fred-oss/design-tokens, so this frame
         tracks Fred's palette in both themes instead of guessing at it. */
      :root { font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: transparent; color: var(--on-surface); }
      h1 { font-size: 1.15rem; margin: 0 0 2px; }
      .sub { color: var(--on-surface-muted); font-size: 0.82rem; margin-bottom: 16px; }
      select, input, button { font: inherit; }
      select, input {
        padding: 7px 10px; border: 1px solid var(--outline-variant); border-radius: var(--radius-s);
        background: transparent; color: inherit;
      }
      .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
      .bar select { flex: 1; }
      button { padding: 6px 12px; border: 0; border-radius: var(--radius-s);
               background: var(--primary); color: var(--on-primary); cursor: pointer; }
      button.ghost { background: none; color: var(--primary); padding: 4px 8px; }
      button.ghost:hover { background: var(--surface-container); }
      .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .stat { flex: 1 1 110px; border: 1px solid var(--outline-muted);
              border-radius: var(--radius-s); padding: 9px 12px; }
      .stat .n { font-size: 1.3rem; font-weight: 650; font-variant-numeric: tabular-nums; }
      .stat .k { font-size: 0.72rem; color: var(--on-surface-muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .doc { border: 1px solid var(--outline-muted); border-radius: var(--radius-s);
             padding: 12px 14px; margin-bottom: 10px; }
      .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .name { font-weight: 600; }
      .pill { margin-left: auto; font-size: 0.72rem; padding: 2px 9px; border-radius: var(--radius-full); white-space: nowrap; }
      .unreviewed { background: var(--secondary-container); color: var(--on-secondary-container); }
      .reviewed { background: var(--success-container); color: var(--on-success-container); }
      .needs_work { background: var(--warning-container); color: var(--on-warning-container); }
      .note { font-size: 0.82rem; color: var(--on-surface-muted); margin-top: 6px; }
      .actions { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
      .actions input { flex: 1 1 220px; font-size: 0.85rem; padding: 5px 9px; }
      #err { color: var(--error); font-size: 0.85rem; margin-bottom: 8px; }
      .empty { color: var(--on-surface-muted); font-size: 0.88rem; }
      .hint { color: var(--on-surface-muted); font-size: 0.78rem; margin: 14px 0 0; }
    </style>
  </head>
  <body>
    <h1>Document Triage</h1>
    <div class="sub" id="ctx">connecting…</div>

    <div class="bar">
      <select id="folder"><option value="">Loading folders…</option></select>
      <button class="ghost" id="ask">Ask an agent</button>
    </div>

    <div id="err"></div>
    <div id="view"></div>

    <p class="hint">
      Agents can read this board and propose triage in chat, but only you can
      record a decision — every mark below is written under your own identity.
    </p>

    <script type="module">
      // Frame side of the Fred application protocol, spoken through Fred's own
      // published client. This page holds no token and names no upstream: every
      // call is asked of the host, which attaches the caller's bearer and routes
      // to this application's own service.
      import { createFredApplicationClient } from "./fred-iframe-sdk.js";

      // The host origin is deployment configuration, not something to infer from
      // a message or the referrer. Fred serves this frame through its own gateway
      // under /apps/document-triage, so the frame's origin is the host's. An
      // absolute-URL deployment on a separate origin must set this explicitly.
      const clientOptions = {
        hostOrigin: window.location.origin,
        applicationId: "document-triage",
        connectionTimeoutMs: 15000,
        requestTimeoutMs: 15000,
      };

      let client = null;
      let teamId = null;
      let tagId = null;
      let loading = false;   // re-entrancy guard: the poll must not overlap a load

      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));

      // The host prefixes /app-services/<app>/teams/<team> itself, so a path
      // here is relative to that root — never repeat the team segment. The client
      // resolves any status, so a failed call is this app's own to detect.
      async function hostFetch(path, init = {}) {
        // Every body here is JSON and nothing downstream says so: the client
        // sends the headers it is given, and a fetch with an undeclared string
        // body is tagged as plain text, which the API rejects.
        const response = await client.request(path, {
          ...init,
          headers: init.body ? { "content-type": "application/json", ...init.headers } : init.headers,
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const body = await response.text();
        try { return body ? JSON.parse(body) : null; }
        catch { throw new Error("bad JSON"); }
      }

      const fail = (msg) => { document.getElementById("err").textContent = msg; };
      const statCard = (n, k) => `<div class="stat"><div class="n">${n}</div><div class="k">${k}</div></div>`;

      async function loadFolders() {
        if (!teamId) return;
        try {
          const data = await hostFetch("folders");
          const items = data.items || [];
          const select = document.getElementById("folder");
          if (!items.length) {
            select.innerHTML = '<option value="">No document folders</option>';
            document.getElementById("view").innerHTML =
              '<div class="empty">This team has no document folders to triage.</div>';
            return;
          }
          select.innerHTML =
            '<option value="">Choose a folder…</option>' +
            items.map((f) => `<option value="${esc(f.tag_id)}">${esc(f.path)}</option>`).join("");
          fail("");
        } catch (e) {
          fail(`Could not list folders: ${e.message}`);
        }
      }

      function render(data) {
        const items = data.items || [];
        const counts = data.counts || {};
        const stats = `
          <div class="stats">
            ${statCard(data.total ?? items.length, "documents")}
            ${statCard(counts.reviewed || 0, "reviewed")}
            ${statCard(counts.needs_work || 0, "needs work")}
            ${statCard(counts.unreviewed || 0, "untouched")}
          </div>`;

        const list = items.length
          ? items.map((d) => `
              <div class="doc" data-slug="${esc(d.slug)}">
                <div class="row">
                  <span class="name">${esc(d.document_name)}</span>
                  <span class="pill ${esc(d.mark)}">${esc(d.mark.replace("_", " "))}</span>
                </div>
                ${d.note ? `<div class="note">${esc(d.note)}${d.updated_at ? ` · ${esc(d.updated_at)}` : ""}</div>` : ""}
                <div class="actions">
                  <input placeholder="Add a note (optional)" value="${esc(d.note || "")}" />
                  <button data-mark="reviewed">Reviewed</button>
                  <button data-mark="needs_work">Needs work</button>
                  <button class="ghost" data-mark="unreviewed">Clear</button>
                </div>
              </div>`).join("")
          : '<div class="empty">This folder has no documents.</div>';

        document.getElementById("view").innerHTML = stats + list;

        for (const card of document.querySelectorAll(".doc")) {
          const slug = card.dataset.slug;
          const item = items.find((d) => d.slug === slug);
          const input = card.querySelector("input");
          for (const button of card.querySelectorAll("button[data-mark]")) {
            button.addEventListener("click", () => mark(item, button.dataset.mark, input.value));
          }
        }
      }

      async function mark(item, value, note) {
        try {
          // The uid travels in the body, never in the URL: it is an internal
          // identifier, and the server re-derives the slug from it to check
          // this client did not invent one.
          await hostFetch(`board/${encodeURIComponent(item.slug)}/mark`, {
            method: "POST",
            body: JSON.stringify({
              document_uid: item.document_uid,
              document_name: item.document_name,
              mark: value,
              note: note || "",
            }),
          });
          fail("");
          load(true);
        } catch (e) {
          fail(`Could not save: ${e.message}`);
        }
      }

      async function load(force) {
        if (!teamId || !tagId || loading) return;
        // Do not redraw underneath someone typing a note.
        if (!force && document.activeElement?.tagName === "INPUT") return;
        loading = true;
        try {
          render(await hostFetch(`board?tag_id=${encodeURIComponent(tagId)}`));
          fail("");
        } catch (e) {
          fail(`Could not load: ${e.message}`);
        } finally {
          loading = false;
        }
      }

      document.getElementById("folder").addEventListener("change", (event) => {
        tagId = event.target.value || null;
        document.getElementById("view").innerHTML = "";
        load(true);
      });

      // `fred:open-chat` names no destination — the host picks where it lands.
      // Nothing about the board travels through it: the agent reads the board
      // itself, with its own runtime identity.
      document.getElementById("ask").addEventListener("click", () => {
        // Asking the host to open a chat is an action on a connected client,
        // and this button is in the page from the start.
        if (teamId) client.openChat(null);
      });

      // No push channel exists, so triage done elsewhere arrives by polling.
      setInterval(() => load(false), 10000);

      // Connect last. The client announces the frame, retrying until the host
      // answers, and resolves with the context that starts the first load. A
      // team switch remounts this frame, so the context never changes under it.
      // Construction itself fails when this page is opened directly instead of
      // inside Fred, so it belongs in the same guard as the handshake.
      try {
        client = createFredApplicationClient(clientOptions);
        const context = await client.connect();
        teamId = context.team?.id ?? null;
        document.getElementById("ctx").textContent = `${context.team?.name ?? "team"} · protocol v1`;
        // The host owns the palette. It also republishes its context when the
        // user changes it, so a theme switch in Fred reaches this frame live.
        window.fredTheme(context.theme);
        client.onContext((next) => window.fredTheme(next.theme));
        loadFolders();
      } catch (e) {
        document.getElementById("ctx").textContent = "not connected";
        document.getElementById("err").textContent = `Could not reach Fred: ${e.message}`;
      }
    </script>
  </body>
</html>
