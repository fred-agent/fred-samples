[project]
name = "fred-capability-document-triage"
version = "0.1.0"
description = "Sample capability: read a team's triage board and propose triage from the document corpus."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Same floor as the sample agent pod, so installing this into it cannot
    # drag the SDK backwards. No httpx here: this capability makes no outbound
    # call of its own -- it only uses the ports the runtime injects.
    "fred-sdk>=4.0.0",
    "langchain-core",
]

# Installing this package IS the registration: the agents pod discovers the
# capability at boot through this entry point.
[project.entry-points."fred.capabilities"]
document_triage = "fred_capability_document_triage.capability:DocumentTriageCapability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fred_capability_document_triage"]

[tool.uv.sources]
# Local path override for development against the monorepo's own fred-core /
# fred-sdk / fred-runtime, sibling to this repo under ~/Fred. Keeps `uv run` /
# `uv sync` from silently reverting to the PyPI versions. Comment out to force
# PyPI resolution.
fred-sdk = { path = "../../../../fred/libs/fred-sdk", editable = true }
